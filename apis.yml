aid: scale3
name: Scale3
description: >-
  Scale3 Labs is a modern observability and infrastructure platform for Web3
  and generative AI. Its Web3 products (Autopilot, Nodepilot and Blockchain
  Intelligence) let node operators and validators deploy, monitor, log and
  alert on blockchain nodes across 40+ chains including Ethereum, Sui, Solana,
  Cosmos and Polkadot, with a Blockchain Intelligence REST API that surfaces
  node software updates and network announcements. Scale3 also builds Langtrace,
  an open-source OpenTelemetry-based observability SDK for LLM applications.
  The company is SOC 2 Type 1 certified and is backed by Redpoint Ventures.
