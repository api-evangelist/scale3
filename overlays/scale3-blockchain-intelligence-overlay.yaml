overlay: 1.0.0
info:
  title: API Evangelist enhancements for Scale3 Blockchain Intelligence API
  version: 1.0.0
extends: openapi/scale3-blockchain-intelligence-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-enrichment: true
      x-apievangelist-notes: >-
        Spec derived by API Evangelist from the published Scale3 Blockchain
        Intelligence documentation (docs.scale3labs.com). Access requires an
        Enterprise license and an API key; requests also require the header
        x-user-agent: s3l-web-client.
  - target: $.info
    update:
      x-artifacts:
        authentication: authentication/scale3-authentication.yml
        conventions: conventions/scale3-conventions.yml
        errors: errors/scale3-problem-types.yml
        data_model: data-model/scale3-data-model.yml
        lifecycle: lifecycle/scale3-lifecycle.yml
  - target: $.info
    update:
      x-agentic-access: agentic-access/scale3-agentic-access.yml
